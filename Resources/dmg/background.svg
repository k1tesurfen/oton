<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <!-- DMG window background. Finder places oton.app at (170,165), Applications at (470,165),
       the Alfred workflow at (320,305); icon size 80. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#e6e8ed"/>
    </linearGradient>
  </defs>
  <rect width="640" height="440" fill="url(#bg)"/>
  <g font-family="-apple-system, Helvetica Neue, Helvetica, sans-serif" fill="#5c6372" text-anchor="middle">
    <text x="320" y="52" font-size="22" font-weight="600" fill="#2b2f38">oton installieren</text>
    <text x="320" y="76" font-size="12.5">oton in den Programme-Ordner ziehen</text>
    <path d="M250 165 H382" stroke="#9aa1b0" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M372 155 L386 165 L372 175" stroke="#9aa1b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="320" y="258" font-size="11.5">optional, für Alfred (Stichwort „ot“): doppelklicken</text>
    <text x="320" y="422" font-size="11" fill="#7a8190">Erster Start: Systemeinstellungen → Datenschutz &amp; Sicherheit → „Dennoch öffnen“</text>
  </g>
</svg>
