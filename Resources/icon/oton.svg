<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- oton: a thick O (sides heavier than top/bottom) with a dot in the middle, in soft white
       neumorphism: light from the top left, everything raised out of the same material.
       macOS icon grid: 824×824 rounded square inset 100 px. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#e4e6eb"/>
    </linearGradient>
    <linearGradient id="raised" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde4"/>
    </linearGradient>
    <!-- The icon's own shadow on the desktop. -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <!-- Raised: white highlight up-left, grey shadow down-right. -->
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-16" dy="-16" stdDeviation="16" flood-color="#ffffff" flood-opacity="1"/>
      <feDropShadow dx="20" dy="24" stdDeviation="18" flood-color="#6f7789" flood-opacity="0.7"/>
    </filter>
    <!-- The hole of the O sits a little deeper: inner shadow along its top-left rim. -->
    <filter id="inset" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="14" dy="16" in="SourceAlpha" result="o"/>
      <feGaussianBlur stdDeviation="14" in="o" result="b"/>
      <feComposite operator="out" in="SourceAlpha" in2="b" result="edge"/>
      <feFlood flood-color="#6f7789" flood-opacity="0.6"/>
      <feComposite operator="in" in2="edge"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#drop)"/>
  <ellipse cx="512" cy="512" rx="173" ry="204" fill="#e9ebef" filter="url(#inset)"/>
  <path fill="url(#raised)" fill-rule="evenodd" filter="url(#soft)"
        d="M512 212 a299 300 0 1 0 0.01 0 Z
           M512 308 a173 204 0 1 1 -0.01 0 Z"/>
  <circle cx="512" cy="512" r="89" fill="url(#raised)" filter="url(#soft)"/>
</svg>
